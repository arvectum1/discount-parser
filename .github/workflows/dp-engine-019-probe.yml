name: DP-ENGINE-019 apply wrapper pruning

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dp-engine-019
          fetch-depth: 0
      - name: Apply staged wrapper pruning
        run: python .github/dp_engine_019_remediate.py
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Verify semantic regressions
        run: pytest -q tests/dp_engine/test_semantic_html_records.py tests/dp_engine/test_live_semantic_remediation.py
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DP-ENGINE-019 remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add arvectum_data/engine/html_records.py tests/dp_engine/test_semantic_html_records.py
          git diff --cached --check
          git commit -m "fix(engine): bound mixed offer cards across signal types"
          git push origin HEAD:feat/dp-engine-019
