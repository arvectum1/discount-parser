name: DP-ENGINE-019 identity probes

on:
  push:
    branches: [feat/dp-engine-019]
    paths:
      - ".github/workflows/dp-engine-019-probe.yml"

permissions:
  contents: read

jobs:
  identity-probe:
    name: identity probe (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source:
          - promokood
          - berikod
          - promokodi_net_ru
    env:
      DP_DATABASE_URL: sqlite:///./dp_engine_019_${{ matrix.source }}.db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install production package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          alembic upgrade head
      - name: Run privacy-safe identity overlap probe
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          import src.sources.engine_runtime as runtime
          from src.sources.runner import run_all

          source = "${{ matrix.source }}"
          counters = Counter()
          original = runtime.compare_offer_sets

          def same(legacy, generic, fields):
              return any(all(getattr(item, field) == getattr(generic, field) for field in fields) for item in legacy)

          def instrumented(legacy, generic):
              counters["pages"] += 1
              counters["legacy_records"] += len(legacy)
              counters["generic_records"] += len(generic)
              for offer in generic:
                  counters["source_url"] += int(same(legacy, offer, ("source_url",)))
                  counters["title"] += int(same(legacy, offer, ("title",)))
                  counters["merchant"] += int(same(legacy, offer, ("merchant",)))
                  counters["url_title"] += int(same(legacy, offer, ("source_url", "title")))
                  counters["url_merchant"] += int(same(legacy, offer, ("source_url", "merchant")))
                  counters["merchant_title"] += int(same(legacy, offer, ("merchant", "title")))
                  counters["url_merchant_title"] += int(same(legacy, offer, ("source_url", "merchant", "title")))
                  if offer.promo_code is not None:
                      counters["generic_code_nonnull"] += 1
                      counters["promo_code"] += int(same(legacy, offer, ("promo_code",)))
                      counters["url_title_code"] += int(same(legacy, offer, ("source_url", "title", "promo_code")))
              return original(legacy, generic)

          runtime.compare_offer_sets = instrumented
          try:
              rows = run_all(only=source)
          finally:
              runtime.compare_offer_sets = original
          row = rows[0]
          print(
              f"SOURCE={source} FETCHED={row.fetched} ERRORS={row.errors} "
              f"SELECTED={row.engine_selected_urls} DECODED={row.engine_decoded_pages} "
              f"GENERIC_ACCEPTED={row.engine_generic_pages} PARITY_FAILURES={row.engine_parity_failures} "
              + " ".join(f"{key.upper()}={value}" for key, value in sorted(counters.items()))
          )
          PY
