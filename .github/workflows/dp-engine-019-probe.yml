name: DP-ENGINE-019 apply arbitration fix

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dp-engine-019
          fetch-depth: 0
      - name: Apply staged arbitration fix
        run: python .github/dp_engine_019_remediate.py
      - name: Verify targeted regressions
        run: |
          python -m pip install -e ".[dev]"
          pytest -q tests/dp_engine/test_semantic_html_records.py tests/dp_engine/test_live_semantic_remediation.py
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "DP-ENGINE-019 remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add arvectum_data/engine/html_records.py
          git commit -m "fix(engine): filter navigation and rank mixed record signals"
          git push origin HEAD:feat/dp-engine-019
