name: DP-ENGINE-019 final live acceptance

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: read

jobs:
  live:
    name: live acceptance (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source:
          - promokood
          - promokodik
          - berikod
          - promokodi_net_ru
          - promko
    env:
      DP_DATABASE_URL: sqlite:///./dp_engine_019_${{ matrix.source }}.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and migrate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          alembic upgrade head
      - name: Final remediation regressions
        run: pytest -q tests/dp_engine/test_semantic_html_records.py tests/dp_engine/test_live_semantic_remediation.py tests/test_source_generic_parity.py
      - name: Live customer-path and engine verdict
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          import re
          from src.sources.runner import run_all

          source = "${{ matrix.source }}"
          rows = run_all(only=source)
          if len(rows) != 1:
              raise SystemExit(f"missing source result: {source}")
          row = rows[0]
          kinds = Counter()
          shapes = Counter()
          mismatch_fields = Counter()
          for warning in row.runtime_warnings:
              if warning.startswith("generic_parity_fallback:"):
                  kinds["parity"] += 1
                  match = re.search(r"legacy=(\d+);generic=(\d+);matched=(\d+)", warning)
                  if match:
                      shapes[tuple(map(int, match.groups()))] += 1
                  if ";mismatch=" in warning:
                      for item in warning.split(";mismatch=", 1)[1].split(","):
                          if ":" in item:
                              mismatch_fields[item.rsplit(":", 1)[-1]] += 1
              elif warning.startswith("generic_not_ready_fallback:"):
                  kinds["not_ready"] += 1
              elif warning.startswith("generic_decode_fallback:"):
                  kinds["decode"] += 1
          customer_safe = row.errors == 0 and row.fetched > 0
          engine_ready = row.engine_parity_failures == 0 and row.engine_legacy_pages == 0
          print(
              f"SOURCE={source} CUSTOMER_SAFE={customer_safe} ENGINE_READY={engine_ready} "
              f"FETCHED={row.fetched} ERRORS={row.errors} SELECTED={row.engine_selected_urls} "
              f"DECODED={row.engine_decoded_pages} GENERIC={row.engine_generic_pages} "
              f"LEGACY={row.engine_legacy_pages} PARITY_FAILURES={row.engine_parity_failures} "
              f"KINDS={dict(kinds)} SHAPES={dict(shapes)} FIELDS={dict(sorted(mismatch_fields.items()))}"
          )
          if not customer_safe:
              raise SystemExit("customer live path is not safe")
          PY
