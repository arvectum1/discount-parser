name: DP-ENGINE-019 apply remediation

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dp-engine-019
          fetch-depth: 0
      - name: Apply remediation
        run: python .github/dp_engine_019_remediate.py
      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "DP-ENGINE-019 remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add arvectum_data/engine/html_records.py src/sources/generic_multi_record.py tests/dp_engine/test_semantic_html_records.py tests/dp_engine/test_live_semantic_remediation.py
          git commit -m "fix(engine): remediate live multi-record segmentation and semantics"
          git push origin HEAD:feat/dp-engine-019
