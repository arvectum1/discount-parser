name: DP-ENGINE-019 isolate field regression

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Baseline fixture records
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.sources.generic_multi_record import GenericMultiRecordOfferDecoder, compare_offer_sets
          from src.sources.adapters.promko import PromkoAdapter
          from arvectum_data.engine import RecordStatus

          html = Path('tests/fixtures/promko.html').read_text(encoding='utf-8')
          def dump(label):
              legacy = PromkoAdapter('https://promko.net/ru/').parse(html)
              generic = GenericMultiRecordOfferDecoder().decode(html, page_url='https://promko.net/ru/', source_key='promko')
              print(label, 'legacy', [(x.external_id, x.title, x.source_url, x.merchant, x.promo_code) for x in legacy])
              print(label, 'offers', [(x.external_id, x.title, x.source_url, x.merchant, x.promo_code) for x in generic.offers])
              for record in generic.records.records:
                  attrs = dict(record.boundary.asset.attributes)
                  vals = record.values() if record.status is RecordStatus.READY else {}
                  print(label, 'record', record.status.value, attrs.get('record_anchor_kind'), attrs.get('record_heading'), attrs.get('record_href'), attrs.get('record_action_text'), vals.get('external_id'), vals.get('title'), vals.get('merchant'), vals.get('promo_code'))
              print(label, compare_offer_sets(legacy, generic.offers))
          dump('BASELINE')
          PY
      - name: Apply candidate patch
        run: python .github/dp_engine_019_field_remediate.py
      - name: Patched fixture records
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.sources.generic_multi_record import GenericMultiRecordOfferDecoder, compare_offer_sets
          from src.sources.adapters.promko import PromkoAdapter
          from arvectum_data.engine import RecordStatus

          html = Path('tests/fixtures/promko.html').read_text(encoding='utf-8')
          legacy = PromkoAdapter('https://promko.net/ru/').parse(html)
          generic = GenericMultiRecordOfferDecoder().decode(html, page_url='https://promko.net/ru/', source_key='promko')
          print('PATCHED legacy', [(x.external_id, x.title, x.source_url, x.merchant, x.promo_code) for x in legacy])
          print('PATCHED offers', [(x.external_id, x.title, x.source_url, x.merchant, x.promo_code) for x in generic.offers])
          for record in generic.records.records:
              attrs = dict(record.boundary.asset.attributes)
              vals = record.values() if record.status is RecordStatus.READY else {}
              print('PATCHED record', record.status.value, attrs.get('record_anchor_kind'), attrs.get('record_heading'), attrs.get('record_href'), attrs.get('record_action_text'), vals.get('external_id'), vals.get('title'), vals.get('merchant'), vals.get('promo_code'))
          print('PATCHED', compare_offer_sets(legacy, generic.offers))
          PY
