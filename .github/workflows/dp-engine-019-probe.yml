name: DP-ENGINE-019 source probes

on:
  push:
    branches: [feat/dp-engine-019]
    paths:
      - ".github/workflows/dp-engine-019-probe.yml"

permissions:
  contents: read

jobs:
  source-probe:
    name: live probe (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source:
          - promokood
          - promokodik
          - berikod
          - promokodi_net_ru
          - promko
    env:
      DP_DATABASE_URL: sqlite:///./dp_engine_019_${{ matrix.source }}.db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install production package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          alembic upgrade head
      - name: Run one live production acceptance cycle
        id: acceptance
        shell: bash
        run: |
          mkdir -p output
          set +e
          python -m src.cli engine-acceptance \
            --source "${{ matrix.source }}" \
            --runs 1 \
            --output "output/${{ matrix.source }}.json" \
            > /dev/null
          code=$?
          set -e
          printf '%s\n' "$code" > "output/${{ matrix.source }}.exit.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Print privacy-safe verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = "${{ matrix.source }}"
          path = Path("output") / f"{source}.json"
          if not path.exists():
              print(f"SOURCE={source} STATUS=NO_EVIDENCE")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              row = data.get("sources", [{}])[0] if data.get("sources") else {}
              fields = {
                  "SOURCE": source,
                  "STATUS": row.get("status", data.get("status")),
                  "CUSTOMER_SAFE": row.get("customer_path_safe"),
                  "FETCHED": row.get("fetched_total"),
                  "ERRORS": row.get("errors_total"),
                  "SELECTED": row.get("engine_selected_urls"),
                  "DECODED": row.get("engine_decoded_pages"),
                  "GENERIC": row.get("engine_generic_pages"),
                  "LEGACY": row.get("engine_legacy_pages"),
                  "PARITY_PASS": row.get("parity_pass_pages"),
                  "PARITY_FAIL": row.get("parity_failure_pages"),
                  "EMERGENCY": row.get("emergency_fallback_pages"),
                  "REASONS": ",".join(row.get("reasons", [])),
              }
              print(" ".join(f"{k}={v}" for k, v in fields.items()))
          PY
      - name: Upload privacy-safe source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp-engine-019-${{ matrix.source }}
          path: |
            output/${{ matrix.source }}.json
            output/${{ matrix.source }}.exit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce source result
        if: always()
        shell: bash
        run: |
          code="${{ steps.acceptance.outputs.exit_code }}"
          test -n "$code"
          test "$code" -eq 0
