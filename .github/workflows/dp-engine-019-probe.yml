name: DP-ENGINE-019 live identity component probe

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: read

jobs:
  inspect:
    name: component probe (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source:
          - promokood
          - promokodi_net_ru
          - berikod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Inspect first live failing page
        shell: bash
        run: |
          python - <<'PY'
          from dataclasses import replace
          import re

          from arvectum_data.acquisition import AcquisitionRequest, RenderMode
          from arvectum_data.engine import RecordStatus
          from src.sources.config import load_source_configs
          from src.sources.engine_runtime import ProductionSourceRuntime
          from src.sources.generic_multi_record import compare_offer_sets
          from src.sources.registry import build_adapter

          source_key = "${{ matrix.source }}"
          config = next(item for item in load_source_configs() if item.key == source_key)
          runtime = ProductionSourceRuntime(config)
          collection = runtime.collect()
          warning = next(
              (item for item in collection.warnings if item.startswith("generic_parity_fallback:")),
              None,
          )
          if warning is None:
              print(f"SOURCE={source_key} NO_PARITY_WARNING warnings={collection.warnings[:8]}")
              raise SystemExit(0)
          match = re.match(r"generic_parity_fallback:(https?://.*?):legacy=", warning)
          if not match:
              raise SystemExit(f"cannot parse parity warning: {warning[:500]}")
          page_url = match.group(1)
          acquired = runtime.acquisition.acquire(
              AcquisitionRequest(
                  url=page_url,
                  timeout_s=runtime.policy.timeout_s,
                  max_bytes=runtime.policy.max_bytes,
                  render_mode=RenderMode.AUTO,
              )
          )
          html = acquired.asset.html or ""
          effective_url = acquired.asset.source_url or page_url
          adapter = build_adapter(replace(config, base_url=effective_url, runtime_mode="legacy"))
          legacy = list(adapter.parse(html))
          generic = runtime.generic_decoder.decode(html, page_url=effective_url, source_key=source_key)
          report = compare_offer_sets(legacy, generic.offers)

          def compact(value, limit=130):
              text = re.sub(r"\s+", " ", str(value or "")).strip()
              return text if len(text) <= limit else text[: limit - 3] + "..."

          print(
              f"SOURCE={source_key} PAGE={page_url} LEGACY={len(legacy)} "
              f"GENERIC={len(generic.offers)} RECORDS={len(generic.records.records)} "
              f"MATCHED={report.matched_count}"
          )
          print("LEGACY")
          for item in legacy[:18]:
              print(
                  "L",
                  compact(item.external_id, 90),
                  "|title=", compact(item.title),
                  "|url=", compact(item.source_url, 110),
                  "|merchant=", compact(item.merchant, 80),
                  "|promo=", compact(item.promo_code, 60),
              )

          print("GENERIC")
          for record in generic.records.records[:32]:
              attrs = dict(record.boundary.asset.attributes)
              values = record.values() if record.status is RecordStatus.READY else {}
              print(
                  "G",
                  record.status.value,
                  "|kind=", attrs.get("record_anchor_kind"),
                  "|ref=", compact(record.boundary.source_ref, 70),
                  "|heading=", compact(attrs.get("record_heading"), 100),
                  "|href=", compact(attrs.get("record_href"), 105),
                  "|action_href=", compact(attrs.get("record_action_href"), 105),
                  "|action=", compact(attrs.get("record_action_text"), 70),
                  "|strong=", compact(attrs.get("record_strong"), 80),
                  "|image_alt=", compact(attrs.get("record_image_alt"), 80),
                  "|id=", compact(values.get("external_id"), 90),
                  "|title=", compact(values.get("title"), 110),
                  "|url=", compact(values.get("source_url"), 110),
                  "|merchant=", compact(values.get("merchant"), 80),
                  "|promo=", compact(values.get("promo_code"), 60),
              )

          legacy_by_id = {item.external_id: item for item in legacy}
          generic_by_id = {item.external_id: item for item in generic.offers}
          shared = sorted(set(legacy_by_id) & set(generic_by_id))
          if shared:
              print("SHARED_MISMATCH_SAMPLE")
              for external_id in shared[:20]:
                  left = legacy_by_id[external_id]
                  right = generic_by_id[external_id]
                  differences = []
                  for field in ("title", "source_url", "merchant", "description", "promo_code", "image_url"):
                      if getattr(left, field) != getattr(right, field):
                          differences.append(field)
                  if differences:
                      print(
                          "S", compact(external_id, 90), "|fields=", differences,
                          "|Lmerchant=", compact(left.merchant, 80),
                          "|Gmerchant=", compact(right.merchant, 80),
                          "|Ltitle=", compact(left.title, 110),
                          "|Gtitle=", compact(right.title, 110),
                      )

          print("MISSING", [compact(value, 90) for value in report.missing_ids[:12]])
          print("EXTRA", [compact(value, 90) for value in report.extra_ids[:12]])
          PY
