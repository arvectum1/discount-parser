name: DP-ENGINE-019 gate collection-heading pruning

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dp-engine-019
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply collection-heading pruning
        run: python .github/dp_engine_019_collection_heading.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify structure and canonical fixture parity
        run: |
          pytest -q \
            tests/dp_engine/test_semantic_html_records.py \
            tests/test_source_generic_parity.py
      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DP-ENGINE-019 remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add arvectum_data/engine/html_records.py
          git diff --cached --check
          git diff --cached --quiet && { echo "no product changes"; exit 1; }
          git commit -m "fix(engine): reject collection headings as offer records"
          git push origin HEAD:feat/dp-engine-019
