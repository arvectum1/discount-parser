name: DP-ENGINE-019 apply heading-tail fix

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dp-engine-019
          fetch-depth: 0
      - name: Patch promo-code inference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/sources/generic_multi_record.py")
          text = path.read_text(encoding="utf-8")
          old = '''        match = _CODE_AFTER_LABEL_RE.search(text)\n        if match:\n            value = match.group(1)\n            if value.upper() not in _STOP_CODES:\n                return value\n        tail = text\n        if heading and text.casefold().startswith(heading.casefold()):\n            tail = text[len(heading):]\n        for match in _CODE_SCAN_RE.finditer(tail):\n'''
          new = '''        tail = text\n        if heading and text.casefold().startswith(heading.casefold()):\n            tail = text[len(heading):]\n        match = _CODE_AFTER_LABEL_RE.search(tail)\n        if match:\n            value = match.group(1)\n            if value.upper() not in _STOP_CODES:\n                return value\n        for match in _CODE_SCAN_RE.finditer(tail):\n'''
          if text.count(old) != 1:
              raise SystemExit("expected promo-code inference block exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git config user.name "DP-ENGINE-019 remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sources/generic_multi_record.py
          git commit -m "fix(engine): scope inferred promo codes to record tail"
          git push origin HEAD:feat/dp-engine-019
