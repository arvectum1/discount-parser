name: DP-ENGINE-019 apply final live remediation

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dp-engine-019
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply final generic remediation
        run: python .github/dp_engine_019_final_remediate.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Targeted and canonical parity regressions
        run: |
          pytest -q \
            tests/dp_engine/test_semantic_html_records.py \
            tests/dp_engine/test_live_semantic_remediation.py \
            tests/test_source_generic_parity.py \
            tests/dp_engine/test_production_source_runtime.py
      - name: Commit product remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DP-ENGINE-019 remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            arvectum_data/engine/html_records.py \
            src/sources/generic_multi_record.py \
            tests/dp_engine/test_semantic_html_records.py \
            tests/dp_engine/test_live_semantic_remediation.py
          git diff --cached --check
          git diff --cached --quiet && { echo "no product changes"; exit 1; }
          git commit -m "fix(engine): close live structural and field gaps"
          git push origin HEAD:feat/dp-engine-019
