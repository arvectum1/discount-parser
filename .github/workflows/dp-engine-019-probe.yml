name: DP-ENGINE-019 live acceptance

on:
  push:
    branches:
      - feat/dp-engine-019
    paths:
      - .github/workflows/dp-engine-019-probe.yml

permissions:
  contents: read

jobs:
  live:
    name: live acceptance (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source:
          - promokood
          - promokodik
          - berikod
          - promokodi_net_ru
          - promko
    env:
      DP_DATABASE_URL: sqlite:///./dp_engine_019_${{ matrix.source }}.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and migrate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          alembic upgrade head
      - name: Remediation regressions
        run: pytest -q tests/dp_engine/test_semantic_html_records.py tests/dp_engine/test_live_semantic_remediation.py
      - name: Live production cycle summary
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          import re
          from src.sources.runner import run_all

          source = "${{ matrix.source }}"
          row = run_all(only=source)[0]
          kinds = Counter()
          shapes = Counter()
          mismatch_fields = Counter()
          not_ready_records = 0
          for warning in row.runtime_warnings:
              if warning.startswith("generic_not_ready_fallback:"):
                  kinds["not_ready"] += 1
              elif warning.startswith("generic_parity_fallback:"):
                  kinds["parity"] += 1
                  match = re.search(r"legacy=(\d+);generic=(\d+);matched=(\d+)", warning)
                  if match:
                      shapes[tuple(map(int, match.groups()))] += 1
                  if ";mismatch=" in warning:
                      for item in warning.split(";mismatch=", 1)[1].split(","):
                          if ":" in item:
                              mismatch_fields[item.rsplit(":", 1)[-1]] += 1
              elif warning.startswith("generic_decode_fallback:"):
                  kinds["decode"] += 1
              not_ready_records += warning.count("record_not_ready:")
          print(
              f"SOURCE={source} FETCHED={row.fetched} ERRORS={row.errors} "
              f"SELECTED={row.engine_selected_urls} DECODED={row.engine_decoded_pages} "
              f"GENERIC={row.engine_generic_pages} LEGACY={row.engine_legacy_pages} "
              f"PARITY_FAILURES={row.engine_parity_failures} FALLBACK={row.engine_fallback_used} "
              f"KINDS={dict(sorted(kinds.items()))} SHAPES={dict(shapes)} "
              f"MISMATCH={dict(sorted(mismatch_fields.items()))} NOT_READY_RECORDS={not_ready_records}"
          )
          if row.errors:
              raise SystemExit("production source returned errors")
          PY
      - name: DP-018 acceptance verdict
        shell: bash
        run: |
          set +e
          python -m src.cli engine-acceptance --runs 1 --source "${{ matrix.source }}" --output acceptance.json
          code=$?
          set -e
          python - <<'PY'
          import json
          data = json.load(open("acceptance.json", encoding="utf-8"))
          print(
              "ACCEPTANCE_STATUS=" + str(data.get("status"))
              + " CUSTOMER_SAFE=" + str(data.get("customer_path_safe"))
              + " RETIREMENT_COMPLETE=" + str(data.get("retirement_evidence_complete"))
              + " COMPLETED_RUNS=" + str(data.get("completed_runs"))
              + " SOURCE_COUNT=" + str(data.get("source_count"))
          )
          PY
          echo "ACCEPTANCE_EXIT=$code"
