name: Port DP Engine snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  port:
    if: github.head_ref == 'feature/dp-engine-001-011-port'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Discount Parser integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: target
          fetch-depth: 0

      - name: Checkout exact DP Engine source snapshot
        uses: actions/checkout@v4
        with:
          repository: arvectum1/data-platform
          ref: 7b33e445cb93e0dc4088b3a31b5dc53c80823f2d
          path: source
          fetch-depth: 1

      - name: Port cumulative DP-ENGINE-001..011 snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$SOURCE_SHA" = "7b33e445cb93e0dc4088b3a31b5dc53c80823f2d"

          rm -rf target/arvectum_data target/tests/dp_engine
          mkdir -p target/arvectum_data target/tests/dp_engine target/docs/tasks

          cp -a source/src/arvectum_data/. target/arvectum_data/
          cp -a source/tests/test_*.py target/tests/dp_engine/
          cp -a source/docs/tasks/DP-ENGINE-*.md target/docs/tasks/

          python - <<'PY'
          from pathlib import Path

          # Discount Parser uses repository-root package discovery. Keep the
          # production DP Engine package byte-identical while adapting only its
          # location/package discovery to the target repository layout.
          project = Path('target/pyproject.toml')
          text = project.read_text(encoding='utf-8')
          old = 'include = ["src*"]'
          new = 'include = ["src*", "arvectum_data*"]'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Unexpected setuptools package discovery configuration')
          project.write_text(text, encoding='utf-8')

          # Source test debt discovered by the target regression gate:
          # the real ExtractionResult contract requires `decisions`, while this
          # orchestration test double predates that required field. Adapt the
          # test double only; production engine files remain byte-identical.
          test_file = Path('target/tests/dp_engine/test_orchestration.py')
          test_text = test_file.read_text(encoding='utf-8')
          needle = '        self.asset = asset\n        self.requires_confirmation = requires_confirmation\n'
          replacement = '        self.asset = asset\n        self.decisions = {}\n        self.requires_confirmation = requires_confirmation\n'
          if needle not in test_text:
              raise SystemExit('Expected FakeExtractionResult shape not found')
          test_file.write_text(test_text.replace(needle, replacement, 1), encoding='utf-8')
          PY

          cat > target/docs/DP_ENGINE_IMPORT_PROVENANCE.md <<'EOF'
          # DP Engine import provenance

          **Target repository:** `arvectum1/discount-parser`

          **Target base:** `discount-parser/main` at `af0521a7a5598440d71ff13e60181764e4d86fe6` (`DP-CUST-017`).

          **Source repository:** `arvectum1/data-platform`

          **Source snapshot:** `7b33e445cb93e0dc4088b3a31b5dc53c80823f2d` (`DP-ENGINE-011`).

          The source snapshot contains the cumulative implementation of `DP-ENGINE-001` through `DP-ENGINE-011`, developed and reviewed through Data Platform PRs on 2026-08-28.

          ## Imported scope

          - `data-platform/src/arvectum_data/**` -> `discount-parser/arvectum_data/**`;
          - Data Platform engine regressions -> `discount-parser/tests/dp_engine/**`;
          - `data-platform/docs/tasks/DP-ENGINE-001.md` through `DP-ENGINE-011.md` -> `discount-parser/docs/tasks/**`.

          Data Platform repository-level README, license, GitHub workflows, mirror configuration and project `pyproject.toml` are intentionally not imported.

          ## Integration adaptations

          Production files under `arvectum_data/**` are copied byte-for-byte from the source snapshot. The target packaging configuration is extended to discover the top-level `arvectum_data` package because Discount Parser uses repository-root package discovery.

          During the first target regression run, `tests/test_orchestration.py` exposed pre-existing source test debt: its `FakeExtractionResult` predated the required `ExtractionResult.decisions` field. The imported test double is therefore given `decisions = {}` so it conforms to the production interface. No production engine behavior is changed by this adaptation.

          ## History and ownership boundary

          This is a snapshot port rooted in Discount Parser history, not an unrelated-history merge. The source repository and exact source SHA remain recorded as provenance. Current customer/product integration work is owned by Discount Parser. Data Platform remains intact as reusable-engine provenance and may receive explicitly promoted domain-neutral improvements later.

          ## Readiness boundary

          Import and regression PASS do not by themselves mean the engine is wired into the customer production runtime. Runtime wiring, replacement/adaptation of legacy source-specific paths, browser packaging and customer acceptance remain separate governed integration work.
          EOF

          rm -f target/.github/workflows/port-dp-engine-snapshot.yml

      - name: Validate engine before committing
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q src arvectum_data tests
          python -m pytest tests/dp_engine -q
          python -m pytest -q

      - name: Commit port into Discount Parser history
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(engine): port DP-ENGINE-001..011 into Discount Parser' -m 'Source: arvectum1/data-platform@7b33e445cb93e0dc4088b3a31b5dc53c80823f2d'
          git push origin HEAD:${{ github.head_ref }}

  validate-ported-head:
    needs: port
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout latest integration branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src arvectum_data tests

      - name: Full regression
        run: python -m pytest -q

      - name: Database migration and doctor smoke
        env:
          DP_DATABASE_URL: sqlite:///./ci_smoke.db
        run: |
          alembic upgrade head
          python -c "from src.shared.db import check_db_connection; assert check_db_connection(); print('database smoke: ok')"
          python -m src.cli doctor
