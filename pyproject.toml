[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discount-parser"
version = "0.1.15"
description = "Discount and promo-code aggregation pipeline with Telegram publishing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp-socks>=0.10,<1.0",
  "aiogram>=3.13,<4.0",
  "alembic>=1.14,<2.0",
  "apscheduler>=3.10,<4.0",
  "beautifulsoup4>=4.12,<5.0",
  "fastapi>=0.115,<1.0",
  "httpx[socks]>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "python-calamine>=0.5,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "PyYAML>=6.0,<7.0",
  "rapidfuzz>=3.10,<4.0",
  "sqlalchemy>=2.0.36,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "XlsxWriter>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pyinstaller>=6.0,<7.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*", "arvectum_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
